function noiseBurst(duration=.25,vol=.12,delay=0){ const c=getAC(); if(!c) return; const sr=c.sampleRate, frames=Math.ceil(sr*duration); const b=c.createBuffer(1,frames,sr); const data=b.getChannelData(0); for(let k=0;k<frames;k++){ const t=k/frames; data[k]=(Math.random()*2-1)*Math.pow(1-t,1.4); } const src=c.createBufferSource(); src.buffer=b; const g=c.createGain(); const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.7; g.gain.value=vol; src.connect(bp).connect(g).connect(c.destination); src.start(c.currentTime+delay); src.stop(c.currentTime+delay+duration+.02); }
function missingSE(){ noiseOverlay.classList.remove('active'); void noiseOverlay.offsetWidth; noiseOverlay.classList.add('active'); noiseBurst(.18,.16,0); noiseBurst(.24,.11,.22); noiseBurst(.42,.08,.50); schedule(()=>bgm('ominous',120),950); }
function fadeStop(ms=350){ if(fadeJob) clearInterval(fadeJob); if(music.paused) return; const steps=12,from=music.volume; let n=0; fadeJob=setInterval(()=>{ n++; music.volume=Math.max(0, from*(1-n/steps)); if(n>=steps){ clearInterval(fadeJob); fadeJob=null; music.pause(); music.volume=0; currentTrack=''; } }, Math.max(15,ms/steps)); }
function bgm(track,delayMs=0){ const serial=++bgmSerial; if(bgmPending){ clearTimeout(bgmPending); bgmPending=null; } if(!soundEnabled || !track || track==='none'){ fadeStop(160); return; } if(currentTrack===track && !music.paused) return; if(delayMs<=0) fadeStop(140); const begin=()=>{ if(serial!==bgmSerial || !soundEnabled) return; if(fadeJob){ clearInterval(fadeJob); fadeJob=null; } music.pause(); music.src=TRACKS[track]; music.currentTime=0; music.volume=0; currentTrack=track; const p=music.play(); if(p&&p.catch) p.catch(()=>{}); let n=0; fadeJob=setInterval(()=>{ if(serial!==bgmSerial){ clearInterval(fadeJob); fadeJob=null; return; } n++; music.volume=Math.min(.18,.18*n/18); if(n>=18){ clearInterval(fadeJob); fadeJob=null; } },55); }; if(delayMs>0) bgmPending=setTimeout(()=>{ bgmPending=null; begin(); },delayMs); else begin(); }
function tryTitleAutoplay(){ if(!soundEnabled) return; bgm('main',0); }
function cancelAuto(){if(autoTimer!==null){clearTimeout(autoTimer);autoTimer=null;}}function scheduleAuto(){cancelAuto();if(!autoEnabled||!started||logOpen||!textDone||i>=SCENES.length-1)return;const scene=SCENES[i];const delay=Math.max(1800,Math.min(5400,1300+[...scene.line].length*75));autoTimer=setTimeout(()=>{autoTimer=null;if(autoEnabled&&started&&!logOpen){i++;render();}},delay);}function cancelTyping(){ typingEpoch++; if(typingTimer) clearTimeout(typingTimer); typingTimer=null; }
function typeLine(line,ms=0){ cancelTyping(); const epoch=typingEpoch; dialog.textContent=''; const chars=[...line]; let index=0; textDone=ms<=0; nextMarker.style.opacity=textDone?'1':'.32'; if(ms<=0){ dialog.textContent=line; scheduleAuto(); return; } function tick(){ if(epoch!==typingEpoch) return; if(index>=chars.length){ textDone=true; nextMarker.style.opacity='1'; typingTimer=null; scheduleAuto(); return; } const c=chars[index++]; dialog.textContent+=c; typingTimer=setTimeout(tick, c==='。'||c==='？'||c==='！' ? ms*5 : c==='、' ? ms*3 : ms); } tick(); }
function showAll(){ const s=SCENES[i]; cancelTyping(); dialog.textContent=s.line; textDone=true; nextMarker.style.opacity='1'; scheduleAuto(); }
function showOnomatopoeia(text){}
function playEffect(effect){ clearEffects(); stopSE(); if(effect==='video-start'){ tone(1220,.085,'sine',.11,0,970); noiseBurst(.11,.055,.03); noiseOverlay.classList.remove('video'); void noiseOverlay.offsetWidth; noiseOverlay.classList.add('video'); schedule(()=>noiseOverlay.classList.remove('video'),480); } else if(effect==='paper-cut'){ playSE('paper'); } else if(effect==='boom'){ document.getElementById('game').classList.add('shaking'); document.getElementById('flash').classList.remove('boom'); void document.getElementById('flash').offsetWidth; document.getElementById('flash').classList.add('boom'); impactSE(); } else if(effect==='pop'){ popSE(); } else if(effect==='quirk'){ comicSE(); } else if(effect==='clang'){ playSE('clang'); } else if(effect==='missing'){ missingSE(); } }
function render(){ cancelAuto(); clearEndingFade(); visitedMax=Math.max(visitedMax,i); const s=SCENES[i]; if(s.bg!==lastBg){ bg.style.backgroundImage=s.bg==='black'?'none':`url('${BG[s.bg]}')`;bg.style.backgroundColor=s.bg==='black'?'#000':'transparent'; lastBg=s.bg; } nameE.textContent=s.speaker||'';  spriteLeft.classList.remove('active'); spriteRight.classList.remove('active'); if(s.person!=='none'){ const target=s.person==='naoto'?spriteLeft:spriteRight; const src=EXPRESSIONS[s.expression]; if(target.getAttribute('src')!==src) target.setAttribute('src',src); target.alt=s.speaker; target.classList.add('active'); } const typingSpeed=s.speed===undefined?30:s.speed; typeLine(s.line, typingSpeed); playEffect(s.effect); const delay = s.effect==='paper-cut' ? 1000 : s.effect==='boom' ? 1200 : s.effect==='quirk' ? 700 : s.effect==='clang' ? 1500 : 0; if(s.line==='行方不明なんだよね。'){ bgmSerial++; if(bgmPending){clearTimeout(bgmPending);bgmPending=null;} fadeStop(1100); bgmPending=setTimeout(()=>{bgmPending=null;bgm('main',0);endingBlackout.classList.add('on')},1650); } else {if(s.effect==='blackout')endingBlackout.classList.add('on');bgm(s.music,delay);} }
function next(){ if(logOpen)return; if(autoEnabled){autoEnabled=false;document.getElementById('auto').setAttribute('aria-pressed','false');cancelAuto();} wakeAudio(); if(!started){ start(); return; } if(!textDone){ showAll(); return; } if(i<SCENES.length-1){ i++; render(); } else {clearEndingFade(); intro.style.display='flex'; started=false; i=0; cancelTyping(); tryTitleAutoplay(); } }
function previous(){cancelAuto(); if(autoEnabled){autoEnabled=false;document.getElementById('auto').setAttribute('aria-pressed','false');} if(started && i>0){ i--; render(); } }
function stopTitleMusicNow(){
  bgmSerial++;
  if(bgmPending){clearTimeout(bgmPending);bgmPending=null;}
  if(fadeJob){clearInterval(fadeJob);fadeJob=null;}
  music.pause();music.volume=0;music.currentTime=0;currentTrack='';
}
function start(){
  autoEnabled=false;cancelAuto();document.getElementById('auto').setAttribute('aria-pressed','false');visitedMax=-1;
  getAC();
  stopTitleMusicNow();
  started=true;i=0;intro.style.display='none';
  render();
}
function restart(){autoEnabled=false;cancelAuto();document.getElementById('auto').setAttribute('aria-pressed','false'); getAC(); started=true; i=0; render(); }
function wakeAudio(){ getAC(); if(started && soundEnabled && (music.paused || !currentTrack)){ bgm(SCENES[i].music||'none'); } }
function updateSoundButton(){ const b=document.getElementById('sound'); b.textContent=soundEnabled?'♪ 音ON':'♪ 音OFF'; b.setAttribute('aria-pressed', String(soundEnabled)); }
function openBacklog(){if(!started)return;logOpen=true;cancelAuto();const list=document.getElementById('log-items');list.replaceChildren();for(let j=0;j<=visitedMax;j++){const scene=SCENES[j];if(!scene.line)continue;const entry=document.createElement('div');entry.className='log-entry';if(scene.speaker){const title=document.createElement('strong');title.textContent=scene.speaker;entry.appendChild(title);}const body=document.createElement('span');body.textContent=scene.line;entry.appendChild(body);list.appendChild(entry);}document.getElementById('backlog').hidden=false;list.scrollTop=list.scrollHeight;}function closeBacklog(){document.getElementById('backlog').hidden=true;logOpen=false;scheduleAuto();}document.getElementById('log').addEventListener('click',e=>{e.stopPropagation();openBacklog();});document.getElementById('close-log').addEventListener('click',e=>{e.stopPropagation();closeBacklog();});document.getElementById('auto').addEventListener('click',e=>{e.stopPropagation();if(!started)return;autoEnabled=!autoEnabled;e.currentTarget.setAttribute('aria-pressed',String(autoEnabled));if(autoEnabled)scheduleAuto();else cancelAuto();});
document.getElementById('sound').addEventListener('click',e=>{ e.stopPropagation(); soundEnabled=!soundEnabled; updateSoundButton(); if(soundEnabled){ wakeAudio(); if(started) bgm(SCENES[i].music||'none'); else tryTitleAutoplay(); } else { clearEffects(); fadeStop(80); } });
document.getElementById('play').addEventListener('click',e=>{ e.stopPropagation(); start(); });
document.getElementById('back').addEventListener('click',e=>{ e.stopPropagation(); previous(); });
document.getElementById('startover').addEventListener('click',e=>{ e.stopPropagation(); restart(); });
document.getElementById('box').addEventListener('click', next);
document.getElementById('game').addEventListener('click',e=>{ if(!started) return; if(e.target.closest('button,#box,.intro')) return; next(); });
document.addEventListener('keydown',e=>{ if(logOpen){if(e.key==='Escape'){e.preventDefault();closeBacklog();}return;}if(['ArrowRight',' ','Enter'].includes(e.key)){ e.preventDefault(); next(); } if(e.key==='ArrowLeft'){ e.preventDefault(); previous(); } });
window.addEventListener('load', ()=>{ bg.style.backgroundImage=`url('${BG.festival}')`; updateSoundButton(); tryTitleAutoplay(); });
// Browsers may block unmuted autoplay; a tap on the title background retries without an extra button.
intro.addEventListener('pointerdown',e=>{if(!started && e.target.id!=='play' && music.paused)tryTitleAutoplay();});

['pointerdown','touchstart','mousedown'].forEach(ev=>document.addEventListener(ev, ()=>{ if(started) wakeAudio(); }, {once:true}));
</script>
