<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>Iwade Kitan | Chapter 1</title>
<style>
:root{--ui-bg:rgba(8,12,17,.62);--ui-border:rgba(214,195,163,.62);--gold:#f1d2a0;--text:#fffdf8;--shadow:rgba(0,0,0,.75);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b0f;color:#f8f6f1;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
#game{position:relative;height:100svh;width:100%;overflow:hidden;isolation:isolate;background:#11161d}
#bg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.68) saturate(.9);transition:opacity .35s;z-index:-4}
#veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.08) 25%,rgba(0,0,0,.20) 52%,rgba(0,0,0,.54));z-index:-3;pointer-events:none}
#top{position:absolute;left:0;top:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(180deg,#000a,transparent)}

#controls{display:flex;gap:6px;align-items:center}

#hint{position:absolute;top:68px;right:18px;font-size:12px;color:#fff;opacity:.82;text-shadow:0 1px 6px rgba(0,0,0,.9)}

#sprite{position:absolute;right:-2%;bottom:-6px;width:100%;height:100%;object-fit:contain;object-position:bottom right;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));transition:opacity .18s, transform .25s}
#sprite.hidden{opacity:0;transform:translateY(14px)}
#box{position:absolute;left:clamp(8px,1.6vw,22px);right:clamp(8px,1.6vw,22px);bottom:calc(env(safe-area-inset-bottom) + 12px);min-height:clamp(225px,32svh,300px);padding:22px 22px 16px;border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 36px rgba(0,0,0,.55);display:flex;flex-direction:column;cursor:pointer}
#name{font-size:17px;font-weight:800;letter-spacing:.08em;color:var(--gold);min-height:26px;text-shadow:0 2px 8px rgba(0,0,0,.6)}

.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:linear-gradient(155deg,#0b111fe6,#06090fe7),url('assets/bg/festival.jpg') center/cover;z-index:20}

#onomatopoeia{position:absolute;top:29%;left:50%;transform:translate(-50%,-50%) scale(.7) rotate(-8deg);font-size:clamp(52px,13vw,145px);font-weight:1000;color:#fff;white-space:nowrap;text-shadow:4px 4px #a42824,-4px -4px #a42824,0 8px 35px #000;opacity:0;pointer-events:none;z-index:4}
#onomatopoeia.active{animation:onom .55s ease-out both}
@keyframes onom{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-14deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(-8deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3) rotate(-6deg)}}

const SCENES=[{"bg": "festival", "speaker": "マキ", "line": "シャーーーーッ。\n研ぎ上げた包丁が、コピー用紙をするりと切り裂く。", "person": "maki", "effect": "paper-cut", "speed": 35, "music": "daily", "expression": "maki_normal"}, {"bg": "festival", "speaker": "マキ", "line": "私は、この音が好きだ。\n刃先が紙を抜ける、一瞬の手応え。", "person": "maki", "effect": "", "speed": 34, "music": "daily", "expression": "maki_happy"}, {"bg": "festival", "speaker": "マキ", "line": "関の刃物まつりは、今年もにぎやか。\n試し切りのたびに、お客さんが足を止めてくれる。", "person": "maki", "effect": "", "speed": 25, "music": "daily", "expression": "maki_normal"}, {"bg": "festival", "speaker": "マキ", "line": "よしっ、今日も切れ味、最高。", "person": "maki", "effect": "", "speed": 24, "music": "daily", "expression": "maki_happy"}, {"bg": "festival", "speaker": "マキ", "line": "……ん？", "person": "maki", "effect": "", "speed": 90, "music": "daily", "expression": "maki_thinking"}, {"bg": "festival", "speaker": "マキ", "line": "刃先が、欠けとる……。", "person": "maki", "effect": "", "speed": 80, "music": "daily", "expression": "maki_serious"}, {"bg": "festival", "speaker": "マキ", "line": "誰やーーーーっ！！\nこの包丁使っとったやつはーーーーっ！！！", "person": "maki", "effect": "boom", "speed": 0, "music": "comic", "expression": "maki_angry"}, {"bg": "festival", "speaker": "石榑直人", "line": "……俺です。", "person": "naoto", "effect": "pop", "speed": 95, "music": "comic", "expression": "naoto_bashful"}, {"bg": "festival", "speaker": "マキ", "line": "直人！？\nちょっとって……まさか、冷凍肉とか切っとらんよね？", "person": "maki", "effect": "", "speed": 26, "music": "comic", "expression": "maki_thinking"}, {"bg": "festival", "speaker": "石榑直人", "line": "え？　冷凍肉って切っちゃダメなの？", "person": "naoto", "effect": "", "speed": 28, "music": "comic", "expression": "naoto_bashful"}, {"bg": "festival", "speaker": "マキ", "line": "カチカチの冷凍肉を普通の包丁で切ったら、刃が欠けることあるんよ。", "person": "maki", "effect": "", "speed": 28, "music": "comic", "expression": "maki_thinking"}, {"bg": "festival", "speaker": "マキ", "line": "で、何を切ったん？", "person": "maki", "effect": "", "speed": 45, "music": "comic", "expression": "maki_thinking"}, {"bg": "festival", "speaker": "石榑直人", "line": "……まあ、いろいろ。", "person": "naoto", "effect": "", "speed": 55, "music": "comic", "expression": "naoto_normal"}, {"bg": "festival", "speaker": "マキ", "line": "そりゃあ直すよ。\nでも、包丁でこじったり、叩いたりしたらあかんでね。", "person": "maki", "effect": "", "speed": 27, "music": "comic", "expression": "maki_happy"}, {"bg": "festival", "speaker": "石榑直人", "line": "こじるって何？", "person": "naoto", "effect": "quirk", "speed": 25, "music": "comic", "expression": "naoto_surprised"}, {"bg": "festival", "speaker": "石榑直人", "line": "包丁って叩かないと切れないよ？", "person": "naoto", "effect": "pop", "speed": 28, "music": "comic", "expression": "naoto_wry"}, {"bg": "festival", "speaker": "マキ", "line": "……そういう意味じゃない！", "person": "maki", "effect": "", "speed": 0, "music": "comic", "expression": "maki_angry"}, {"bg": "festival", "speaker": "マキ", "line": "この男は、包丁への愛ってもんがないんだよねー。", "person": "maki", "effect": "", "speed": 31, "music": "comic", "expression": "maki_normal"}, {"bg": "rest", "speaker": "石榑直人", "line": "ちょっと休憩しようよ。関テラスの方、食べ物屋さんも出てるし。", "person": "naoto", "effect": "", "speed": 26, "music": "daily", "expression": "naoto_normal"}, {"bg": "rest", "speaker": "マキ", "line": "……直人、相談したいことがある顔しとるね。", "person": "maki", "effect": "", "speed": 30, "music": "daily", "expression": "maki_normal"}, {"bg": "rest", "speaker": "石榑直人", "line": "あ、ばれた？　ちょっと気になる動画があるんだよね。", "person": "naoto", "effect": "", "speed": 28, "music": "daily", "expression": "naoto_bashful"}, {"bg": "rest", "speaker": "マキ", "line": "また仕事のついで？", "person": "maki", "effect": "", "speed": 30, "music": "daily", "expression": "maki_normal"}, {"bg": "rest", "speaker": "石榑直人", "line": "古い鍛錬施設の耐震のことで、大橋さんに相談されててさ。", "person": "naoto", "effect": "", "speed": 30, "music": "daily", "expression": "naoto_thinking"}, {"bg": "rest", "speaker": "石榑直人", "line": "土地や建物の調査って、古い図面を見ることも多いんだけど……今回は、ちょっと妙なんだ。", "person": "naoto", "effect": "", "speed": 28, "music": "unease", "expression": "naoto_thinking"}, {"bg": "rest", "speaker": "マキ", "line": "妙って、何が？", "person": "maki", "effect": "", "speed": 28, "music": "unease", "expression": "maki_thinking"}, {"bg": "rest", "speaker": "石榑直人", "line": "スマホに残ってた動画。\nマキにも音を聞いてほしい。", "person": "naoto", "effect": "", "speed": 28, "music": "unease", "expression": "naoto_thinking"}, {"bg": "rest", "speaker": "マキ", "line": "音？　うちが？", "person": "maki", "effect": "", "speed": 38, "music": "unease", "expression": "maki_thinking"}, {"bg": "rest", "speaker": "石榑直人", "line": "研磨の音なら、誰より詳しいでしょ。", "person": "naoto", "effect": "", "speed": 28, "music": "unease", "expression": "naoto_wry"}, {"bg": "rest", "speaker": "マキ", "line": "……まあ、聞いてみるけど。", "person": "maki", "effect": "", "speed": 42, "music": "unease", "expression": "maki_normal"}, {"bg": "forge", "speaker": "映像", "line": "動画が再生される。\n使われなくなった旧鍛錬室に、人影はない。", "person": "none", "effect": "video-start", "speed": 34, "music": "none"}, {"bg": "forge", "speaker": "映像", "line": "ほとんど、何も動かない。", "person": "none", "effect": "", "speed": 60, "music": "none"}, {"bg": "forge", "speaker": "映像", "line": "カン。\nカァーーン。\nカン。", "person": "none", "effect": "clang", "speed": 110, "music": "none"}, {"bg": "forge", "speaker": "マキ", "line": "……ちょっと待って。", "person": "maki", "effect": "", "speed": 95, "music": "none", "expression": "maki_serious"}, {"bg": "forge", "speaker": "マキ", "line": "これ、ほんとにこの部屋から聞こえた音なんかな。", "person": "maki", "effect": "", "speed": 36, "music": "none", "expression": "maki_thinking"}, {"bg": "rest", "speaker": "石榑直人", "line": "どういうこと？", "person": "naoto", "effect": "", "speed": 45, "music": "unease", "expression": "naoto_normal"}, {"bg": "rest", "speaker": "マキ", "line": "まだ分からん。\nけど、なんか……変。", "person": "maki", "effect": "", "speed": 45, "music": "unease", "expression": "maki_serious"}, {"bg": "rest", "speaker": "マキ", "line": "で、これ撮った人は何て言っとるの？", "person": "maki", "effect": "", "speed": 34, "music": "unease", "expression": "maki_serious"}, {"bg": "rest", "speaker": "石榑直人", "line": "この動画が入っとったスマホの持ち主……", "person": "naoto", "effect": "", "speed": 36, "music": "none", "expression": "naoto_troubled"}, {"bg": "rest", "speaker": "石榑直人", "line": "行方不明なんだよね。", "person": "naoto", "effect": "missing", "speed": 140, "music": "ominous", "expression": "naoto_troubled"}, {"bg": "rest", "speaker": "", "line": "第一章『コピー紙を切る女』\n―― 第一章 終 ――\n画面をタップするとタイトルへ戻ります", "person": "none", "effect": "end", "speed": 0, "music": "ending"}];

const bg=document.getElementById('bg');
const sprite=document.getElementById('sprite');
const nameE=document.getElementById('name');
const dialog=document.getElementById('dialogue');
const intro=document.getElementById('intro');
const nextMarker=document.getElementById('next');

let i=0, started=false, lastBg='', soundEnabled=true, textDone=true, typingTimer=null, typingEpoch=0;
const music=new Audio(); music.loop=true; music.preload='auto'; music.volume=0; let currentTrack=''; let fadeJob=null; let bgmPending=null; let bgmSerial=0; let effectTimers=[];
const sePaper=new Audio(SE.paper); const seClang=new Audio(SE.clang); [sePaper,seClang].forEach(a=>{a.preload='auto';a.volume=.92;});
let ac=null;
function getAC(){ if(!soundEnabled) return null; try{ ac=ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }catch(e){return null;} }
function schedule(fn,ms){ const t=setTimeout(fn,ms); effectTimers.push(t); return t; }
function clearEffects(){ effectTimers.forEach(clearTimeout); effectTimers=[]; document.getElementById('game').classList.remove('shaking'); document.getElementById('onomatopoeia').classList.remove('active'); noiseOverlay.classList.remove('active'); }
function stopSE(){ [sePaper,seClang].forEach(a=>{a.pause(); try{a.currentTime=0;}catch(e){} }); }
function safePlay(audio){ if(!soundEnabled) return; const p=audio.play(); if(p&&p.catch) p.catch(()=>{}); }
function playSE(name){ if(!soundEnabled) return; if(name==='paper'){ sePaper.currentTime=0; safePlay(sePaper); } else if(name==='clang'){ seClang.currentTime=0; safePlay(seClang); } }
function tone(freq,dur=.12,type='triangle',vol=.08,when=0,endFreq){ const c=getAC(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(Math.max(25,freq),c.currentTime+when); if(endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(25,endFreq),c.currentTime+when+dur); g.gain.setValueAtTime(.0001,c.currentTime+when); g.gain.exponentialRampToValueAtTime(vol,c.currentTime+when+.01); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+when+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+.03); }
function comicSE(){ tone(720,.08,'triangle',.08,0,840); tone(420,.09,'sine',.05,.04,250); }
function popSE(){ tone(330,.08,'triangle',.08,0,180); tone(220,.1,'sine',.06,.06,150); }
function impactSE(){ tone(82,.42,'sawtooth',.18,0,38); tone(124,.32,'triangle',.1,0,48); noiseBurst(.30,.18,.12); }
function noiseBurst(duration=.25,vol=.12,delay=0){ const c=getAC(); if(!c) return; const sr=c.sampleRate, frames=Math.ceil(sr*duration); const b=c.createBuffer(1,frames,sr); const data=b.getChannelData(0); for(let k=0;k<frames;k++){ const t=k/frames; data[k]=(Math.random()*2-1)*Math.pow(1-t,1.4); } const src=c.createBufferSource(); src.buffer=b; const g=c.createGain(); const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.7; g.gain.value=vol; src.connect(bp).connect(g).connect(c.destination); src.start(c.currentTime+delay); src.stop(c.currentTime+delay+duration+.02); }
function missingSE(){ noiseOverlay.classList.remove('active'); void noiseOverlay.offsetWidth; noiseOverlay.classList.add('active'); noiseBurst(.18,.16,0); noiseBurst(.24,.11,.22); noiseBurst(.42,.08,.50); schedule(()=>bgm('ominous',120),950); }
function fadeStop(ms=350){ if(fadeJob) clearInterval(fadeJob); if(music.paused) return; const steps=12,from=music.volume; let n=0; fadeJob=setInterval(()=>{ n++; music.volume=Math.max(0, from*(1-n/steps)); if(n>=steps){ clearInterval(fadeJob); fadeJob=null; music.pause(); music.volume=0; currentTrack=''; } }, Math.max(15,ms/steps)); }
function bgm(track,delayMs=0){ const serial=++bgmSerial; if(bgmPending){ clearTimeout(bgmPending); bgmPending=null; } if(!soundEnabled || !track || track==='none'){ fadeStop(160); return; } if(currentTrack===track && !music.paused) return; if(delayMs<=0) fadeStop(140); const begin=()=>{ if(serial!==bgmSerial || !soundEnabled) return; if(fadeJob){ clearInterval(fadeJob); fadeJob=null; } music.pause(); music.src=TRACKS[track]; music.currentTime=0; music.volume=0; currentTrack=track; const p=music.play(); if(p&&p.catch) p.catch(()=>{}); let n=0; fadeJob=setInterval(()=>{ if(serial!==bgmSerial){ clearInterval(fadeJob); fadeJob=null; return; } n++; music.volume=Math.min(.18,.18*n/18); if(n>=18){ clearInterval(fadeJob); fadeJob=null; } },55); }; if(delayMs>0) bgmPending=setTimeout(()=>{ bgmPending=null; begin(); },delayMs); else begin(); }
function tryTitleAutoplay(){ if(!soundEnabled) return; getAC(); bgm('main',0); }
function cancelTyping(){ typingEpoch++; if(typingTimer) clearTimeout(typingTimer); typingTimer=null; }
function typeLine(line,ms=0){ cancelTyping(); const epoch=typingEpoch; dialog.textContent=''; const chars=[...line]; let index=0; textDone=ms<=0; nextMarker.style.opacity=textDone?'1':'.32'; if(ms<=0){ dialog.textContent=line; return; } function tick(){ if(epoch!==typingEpoch) return; if(index>=chars.length){ textDone=true; nextMarker.style.opacity='1'; typingTimer=null; return; } const c=chars[index++]; dialog.textContent+=c; typingTimer=setTimeout(tick, c==='。'||c==='？'||c==='！' ? ms*5 : c==='、' ? ms*3 : ms); } tick(); }
function showAll(){ const s=SCENES[i]; cancelTyping(); dialog.textContent=s.line; textDone=true; nextMarker.style.opacity='1'; }
function showOnomatopoeia(text){ const el=document.getElementById('onomatopoeia'); el.textContent=text; el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
function playEffect(effect){ clearEffects(); stopSE(); if(effect==='paper-cut'){ playSE('paper'); } else if(effect==='boom'){ document.getElementById('game').classList.add('shaking'); document.getElementById('flash').classList.remove('boom'); void document.getElementById('flash').offsetWidth; document.getElementById('flash').classList.add('boom'); impactSE(); showOnomatopoeia('！！！'); } else if(effect==='pop'){ popSE(); } else if(effect==='quirk'){ comicSE(); } else if(effect==='clang'){ playSE('clang'); } else if(effect==='missing'){ missingSE(); } }

// Source image alpha extents (all sprites 540x720); normalized to a common waist-up viewport.
// Each face starts at the same height, and the navel is hidden behind the dialogue panel.
const PORTRAIT_BOUNDS={
maki_normal:[97,17,443,455],maki_happy:[50,174,501,708],
maki_bashful:[75,41,466,708],maki_serious:[42,29,518,698],
maki_thinking:[171,15,502,693],maki_angry:[0,157,485,712],
naoto_normal:[7,153,532,708],naoto_bashful:[7,158,532,708],
naoto_surprised:[7,159,532,708],naoto_thinking:[50,158,532,708],
naoto_troubled:[7,153,532,708],naoto_wry:[34,160,519,708]
};
function layoutPortrait(expression, side){
 const b=PORTRAIT_BOUNDS[expression]||[30,50,510,710];
 const region=document.getElementById('sprite-wrap');
 const rw=region.clientWidth,rh=region.clientHeight;
 const visibleW=b[2]-b[0], visibleH=b[3]-b[1];
 const targetHeight=rh*.96;
 const targetWidth=Math.min(rw*.69, 340);
 const scale=Math.min(targetHeight/visibleH,targetWidth/visibleW);
 const imageW=540*scale,imageH=720*scale;
 // Keep body fully within screen margins; only the figure's bottom hides at textbox edge.
 const left=(side==='left'? Math.max(4,rw*.02) : Math.min(rw-visibleW*scale-4,rw*.98-visibleW*scale))-b[0]*scale;
 const top=Math.max(0,(rh-visibleH*scale)*.16)-b[1]*scale;
 sprite.style.width=imageW+'px';
 sprite.style.height=imageH+'px';
 sprite.style.left=left+'px';
 sprite.style.top=top+'px';
}
window.addEventListener('resize',()=>{if(started&&SCENES[i].person!=='none')layoutPortrait(SCENES[i].expression,SCENES[i].person==='naoto'?'left':'right')});
function render(){ const s=SCENES[i]; if(s.bg!==lastBg){ bg.style.backgroundImage=`url('${BG[s.bg]}')`; lastBg=s.bg; } nameE.textContent=s.speaker||''; const wrap=document.getElementById('sprite-wrap'); wrap.classList.toggle('left',s.person==='naoto'); wrap.classList.toggle('right',s.person==='maki'); if(s.person==='none'){ sprite.classList.add('hidden'); sprite.removeAttribute('src'); } else { sprite.src=EXPRESSIONS[s.expression]; sprite.alt=s.speaker; layoutPortrait(s.expression,s.person==='naoto'?'left':'right'); sprite.classList.remove('hidden'); } const typingSpeed=s.speed===undefined?30:s.speed; typeLine(s.line, typingSpeed); playEffect(s.effect); const delay = s.effect==='paper-cut' ? 1000 : s.effect==='boom' ? 1200 : s.effect==='quirk' ? 700 : s.effect==='clang' ? 1500 : s.effect==='missing' ? 1200 : 0; bgm(s.music, delay); }
function next(){ wakeAudio(); if(!started){ start(); return; } if(!textDone){ showAll(); return; } if(i<SCENES.length-1){ i++; render(); } else { intro.style.display='flex'; started=false; i=0; cancelTyping(); tryTitleAutoplay(); } }
function previous(){ if(started && i>0){ i--; render(); } }
function stopTitleMusicNow(){
  bgmSerial++;
  if(bgmPending){clearTimeout(bgmPending);bgmPending=null;}
  if(fadeJob){clearInterval(fadeJob);fadeJob=null;}
  music.pause();music.volume=0;music.currentTime=0;currentTrack='';
}
function start(){
  getAC();
  stopTitleMusicNow();
  started=true;i=0;intro.style.display='none';
  render();
}
function restart(){ getAC(); started=true; i=0; render(); }
function wakeAudio(){ getAC(); if(soundEnabled && (music.paused || !currentTrack)){ if(started) bgm(SCENES[i].music||'none'); else tryTitleAutoplay(); } }
function updateSoundButton(){ const b=document.getElementById('sound'); b.textContent=soundEnabled?'♪ 音ON':'♪ 音OFF'; b.setAttribute('aria-pressed', String(soundEnabled)); }
document.getElementById('sound').addEventListener('click',e=>{ e.stopPropagation(); soundEnabled=!soundEnabled; updateSoundButton(); if(soundEnabled){ wakeAudio(); if(started) bgm(SCENES[i].music||'none'); else tryTitleAutoplay(); } else { clearEffects(); fadeStop(80); } });
document.getElementById('play').addEventListener('click',e=>{ e.stopPropagation(); start(); });
document.getElementById('back').addEventListener('click',e=>{ e.stopPropagation(); previous(); });
document.getElementById('startover').addEventListener('click',e=>{ e.stopPropagation(); restart(); });
document.getElementById('box').addEventListener('click', next);
document.getElementById('game').addEventListener('click',e=>{ if(e.target.closest('button,#box,.intro')) return; next(); });
document.addEventListener('keydown',e=>{ if(['ArrowRight',' ','Enter'].includes(e.key)){ e.preventDefault(); next(); } if(e.key==='ArrowLeft'){ e.preventDefault(); previous(); } });
window.addEventListener('load', ()=>{ bg.style.backgroundImage=`url('${BG.festival}')`; updateSoundButton(); tryTitleAutoplay(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !started) tryTitleAutoplay(); });
['pointerdown','touchstart','mousedown'].forEach(ev=>document.addEventListener(ev, ()=>{ wakeAudio(); }, {once:true}));
</script>
</body>
